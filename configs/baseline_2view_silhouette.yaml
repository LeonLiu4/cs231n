experiment:
  name: baseline_2view_silhouette
  seed: 42
  output_dir: runs/baseline_2view_silhouette

data:
  shapenet_root: data/ShapeNetCore.v2
  processed_dir: data/processed_shapenet_2view_silhouette
  render_mode: silhouette
  category: "03001627"
  num_gt_points: 2048
  image_size: 224
  num_views: 2
  augment: false
  max_train_samples: null
  max_val_samples: null

model:
  dinov2_variant: dinov2_vitb14
  num_output_points: 2048
  hidden_dim: 1024
  freeze_backbone: true
  feature_mode: cls_patch_mean
  head_type: folding
  unfreeze_last_blocks: 4
  output_tanh: false
  normalize_output: true
  use_pose: true
  fusion: concat

train:
  batch_size: 6
  num_epochs: 120
  lr: 1.0e-4
  backbone_lr: 2.0e-5
  min_lr: 1.0e-6
  warmup_epochs: 5
  warmup_start_factor: 0.1
  grad_clip: 1.0
  weight_decay: 0.01
  num_workers: 0
  scheduler: cosine_warmup
  early_stopping_patience: 20
  log_every: 10
  save_every: 5

eval:
  f_score_threshold: 0.01
