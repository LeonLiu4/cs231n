experiment:
  name: single_view_baseline
  seed: 42
  output_dir: runs/single_view_baseline

data:
  shapenet_root: data/ShapeNetCore.v2
  processed_dir: data/processed
  split_file: data/splits/shapenet_chair.json
  category: "03001627"  # chair
  num_gt_points: 2048
  image_size: 224
  num_views: 1
  max_train_samples: null
  max_val_samples: null

model:
  dinov2_variant: dinov2_vitb14
  num_output_points: 2048
  hidden_dim: 512
  freeze_backbone: true

train:
  batch_size: 8
  num_epochs: 100
  lr: 1.0e-4
  weight_decay: 0.01
  num_workers: 0
  early_stopping_patience: 15
  log_every: 10
  save_every: 5

eval:
  f_score_threshold: 0.01
